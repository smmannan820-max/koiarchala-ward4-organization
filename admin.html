<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>অ্যাডমিন</title><link rel="stylesheet" href="styles.css"></head><body><header><h1>অ্যাডমিন প্যানেল</h1><a href="index.html">ওয়েবসাইট</a></header><main><section id="loginBox"><h2>অ্যাডমিন লগইন</h2><form id="login"><input name="email" type="email" placeholder="ইমেইল" required><input name="password" type="password" placeholder="পাসওয়ার্ড" required><button>লগইন</button></form><p id="loginMsg"></p></section><section id="panel" hidden><button id="logout">লগআউট</button><h2>সদস্য যোগ করুন</h2><form id="memberForm"><input name="name" placeholder="নাম" required><input name="phone" placeholder="মোবাইল"><input name="address" placeholder="ঠিকানা"><input name="blood" placeholder="রক্তের গ্রুপ"><input name="profession" placeholder="পেশা"><button>সংরক্ষণ</button></form><h2>কার্যক্রম যোগ করুন</h2><form id="activityForm"><input name="title" placeholder="শিরোনাম" required><textarea name="details" placeholder="বিবরণ"></textarea><button>সংরক্ষণ</button></form><h2>অনুদান/সহায়তার হিসাব</h2><form id="financeForm"><select name="kind"><option value="income">অনুদান জমা</option><option value="expense">সহায়তা/খরচ</option></select><input name="person" placeholder="দাতা/প্রাপকের নাম" required><input name="amount" type="number" min="1" placeholder="টাকা" required><input name="details" placeholder="বিবরণ"><button>সংরক্ষণ</button></form><h2>ছবি আপলোড</h2><form id="imageForm"><input name="image" type="file" accept="image/*" required><input name="caption" placeholder="ছবির বিবরণ"><button>আপলোড</button></form><p id="adminMsg"></p></section></main><script type="module" src="admin.js"></script></body></html>
